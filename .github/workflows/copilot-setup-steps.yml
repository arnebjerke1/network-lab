name: "Copilot Setup Steps"

# Run when this file changes to validate setup, and allow manual testing
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch main branch for JIT steering
        run: git fetch origin main:refs/remotes/origin/main || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"
          cache-dependency-path: course_scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r course_scraper/requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium
